name: Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Cargo profile (release = slower build, faster game; fast = quicker build)"
        default: release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Android SDK / NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;34.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          PROFILE: ${{ inputs.profile }}
        run: ./packaging/android/build_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-apk
          path: target/android/horizon.apk
